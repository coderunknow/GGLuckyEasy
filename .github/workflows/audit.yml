name: GGLuckyEasy audit
on:
  pull_request:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run audit
      - uses: actions/upload-artifact@v4
        with:
          name: ggluckyeasy-dev1-artifacts
          path: |
            dist/
            evidence/
          if-no-files-found: error
